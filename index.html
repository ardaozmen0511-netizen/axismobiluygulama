<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#04050d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AXIS — AlreonX</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root {
    --bg: #04050d; --panel: #0b0e1f; --panel2: #11152b; --line: #1c2140;
    --text: #e8ecfb; --dim: #8a93b8; --c: #19c3ff; --c2: #2b72fd;
    --grad: linear-gradient(90deg, #4a2ff0 0%, #2b72fd 55%, #02c8fe 100%);
    --user: #141a4d;
    --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: radial-gradient(700px 380px at 50% -8%, #16135a 0%, #0a0c2a 40%, var(--bg) 75%) fixed;
         color: var(--text); font: 15.5px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--c); outline-offset: 2px; border-radius: 8px; }

  /* Üst */
  header { padding: calc(var(--top) + 10px) 14px 8px; display: flex; align-items: center; gap: 10px; }
  .logo { height: 20px; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }
  .thinking .dot { background: var(--c); box-shadow: 0 0 8px var(--c); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .spacer { flex: 1; }
  .ibtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel); position: relative; }
  .ibtn:active { background: var(--panel2); }
  .badge { position: absolute; top: -5px; right: -5px; background: var(--grad); color: #fff; font-size: 10.5px; font-weight: 700; border-radius: 9px; padding: 0 5px; min-width: 17px; text-align: center; }
  .courses { display: flex; gap: 6px; overflow-x: auto; padding: 4px 14px 10px; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .courses::-webkit-scrollbar { display: none; }
  .course { flex: none; padding: 7px 14px; border-radius: 20px; font-size: 13.5px; color: var(--dim); border: 1px solid var(--line); background: var(--panel); }
  .course.on { background: var(--grad); color: #fff; border-color: transparent; font-weight: 600; }

  /* Sohbet */
  #chat { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 16px 12px 8px; }
  .msg { display: flex; gap: 8px; margin: 0 0 14px; }
  .msg.user { justify-content: flex-end; }
  .avatar { flex: none; width: 28px; height: 28px; border-radius: 50%; background: url(/avatar.png) center / cover; box-shadow: 0 0 12px rgba(43, 114, 253, .45); margin-top: 2px; }
  .bubble { max-width: 86%; padding: 10px 13px; border-radius: 16px; overflow-wrap: anywhere; position: relative; }
  .user .bubble { background: var(--user); border: 1px solid #2a3a8f; border-bottom-right-radius: 5px; }
  .axis .bubble { background: var(--panel); border: 1px solid var(--line); border-top-left-radius: 5px; max-width: calc(100% - 36px); }
  .bubble p { margin: 0 0 9px; } .bubble p:last-child { margin: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 9px 20px; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 15.5px; margin: 10px 0 5px; color: #6fb4ff; }
  .bubble code { font: 13px ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; background: #0a0f1a; border: 1px solid var(--line); border-radius: 5px; padding: 1px 4px; }
  .bubble pre { background: #060a12; border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; overflow-x: auto; margin: 7px 0 9px; position: relative; }
  .bubble pre code { background: none; border: 0; padding: 0; white-space: pre; font-size: 12.5px; }
  .user .bubble pre { background: #0c1238; border-color: #2a3a8f; }
  .bubble a { color: var(--c); }
  .bubble strong { color: #fff; }
  .codecopy { position: absolute; top: 5px; right: 5px; font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; background: var(--panel); }
  .user .codecopy { display: none; }
  .tool { margin: -6px 0 12px 36px; font-size: 12px; color: var(--dim); }
  .tool span { display: inline-block; max-width: 100%; background: rgba(43, 114, 253, .08); border: 1px solid rgba(43, 114, 253, .25); border-radius: 20px; padding: 2px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .err { margin: 0 0 14px 36px; padding: 9px 12px; border: 1px solid rgba(255, 107, 107, .4); background: rgba(255, 107, 107, .08); color: #ffb3b3; border-radius: 12px; font-size: 14px; }
  .typing .bubble { display: flex; align-items: center; gap: 9px; color: var(--dim); font-size: 14px; }
  .dots { display: flex; gap: 4px; } .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c2); animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .quick { display: flex; gap: 7px; overflow-x: auto; margin: -4px -12px 14px; padding: 0 12px 0 48px; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .qbtn { flex: none; font-size: 13px; padding: 7px 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel); color: var(--dim); }
  .qbtn:active { color: var(--text); border-color: var(--c2); }

  /* Karşılama */
  #welcome { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 4vh; }
  .wlogo { width: min(300px, 78%); filter: drop-shadow(0 0 26px rgba(43, 114, 253, .4)); }
  #welcome h1 { font-size: 23px; margin-top: 14px; }
  #welcome p { color: var(--dim); margin-top: 3px; padding: 0 10px; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; width: 100%; }
  .chip { text-align: left; padding: 11px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
  .chip:active { border-color: var(--c2); background: var(--panel2); }
  .chip b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.3; }
  .chip small { color: var(--dim); font-size: 12px; line-height: 1.3; display: block; margin-top: 3px; }
  .install { margin-top: 18px; display: none; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid #2a3a8f; background: #0e1440; font-size: 13.5px; text-align: left; }
  .install.show { display: flex; }
  .install button { flex: none; background: var(--grad); color: #fff; font-weight: 600; border-radius: 10px; padding: 7px 12px; font-size: 13px; }

  /* Yazma kutusu */
  footer { padding: 8px 10px calc(var(--bottom) + 10px); }
  .composer { display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 6px 6px 6px 14px; }
  .composer:focus-within { border-color: var(--c2); }
  textarea { flex: 1; resize: none; border: 0; outline: 0; background: none; color: var(--text); font: inherit; font-size: 16px; max-height: 140px; padding: 7px 0; }
  textarea::placeholder { color: #5f6a90; }
  #send { width: 40px; height: 40px; border-radius: 14px; background: var(--grad); color: #fff; display: grid; place-items: center; flex: none; }
  #send:disabled { background: var(--line); color: var(--dim); }

  /* İlerleme paneli */
  #shade { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 86dvh; background: var(--panel); border-top: 1px solid var(--line);
           border-radius: 20px 20px 0 0; transform: translateY(100%); transition: transform .25s ease; display: flex; flex-direction: column; padding-bottom: var(--bottom); }
  body.open #shade { opacity: 1; pointer-events: auto; } body.open #sheet { transform: none; }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: #2a3158; margin: 9px auto 4px; }
  .shead { display: flex; align-items: center; padding: 6px 16px 10px; }
  .shead h2 { font-size: 17px; flex: 1; }
  .sbody { overflow-y: auto; padding: 4px 16px 16px; }
  .sbody h3 { font-size: 13px; color: #6fb4ff; margin: 16px 0 8px; font-weight: 600; }
  .sbody h3:first-child { margin-top: 4px; }
  .field { display: flex; gap: 8px; }
  .field input { flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; color: var(--text); font: inherit; font-size: 16px; }
  .item { display: flex; align-items: flex-start; gap: 8px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 7px; background: var(--panel2); font-size: 14px; }
  .item span { flex: 1; } .item small { color: var(--dim); display: block; font-size: 11.5px; }
  .item button { color: var(--dim); font-size: 17px; padding: 0 4px; }
  .empty { color: var(--dim); font-size: 13.5px; }
  .sfoot { padding: 10px 16px 14px; border-top: 1px solid var(--line); text-align: center; }
  .sfoot img { width: 110px; margin: 0 auto 6px; display: block; }
  .sfoot small { color: #5f6a90; font-size: 11px; }
  .keycard { margin-top: 18px; padding: 12px 14px; border-radius: 14px; border: 1px solid #5a3a2a; background: rgba(194, 136, 78, .1); color: #f0c99e; font-size: 13.5px; text-align: left; }
  .keycard button { margin-top: 8px; background: var(--grad); color: #fff; font-weight: 600; border-radius: 10px; padding: 7px 12px; font-size: 13px; }
  .wide { width: 100%; margin-top: 10px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header id="hdr">
  <img class="logo" src="/logo_axis_mark.png" alt="AXIS">
  <div class="status"><span class="dot"></span><span id="statusText">Hazır</span></div>
  <div class="spacer"></div>
  <button class="ibtn" id="newBtn" aria-label="Yeni sohbet">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="ibtn" id="progBtn" aria-label="İlerlemen">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0-6 6c0 2.2 1.2 3.6 2.2 4.6.6.6.8 1.4.8 2.2V17h6v-1.2c0-.8.2-1.6.8-2.2 1-1 2.2-2.4 2.2-4.6a6 6 0 0 0-6-6zM9 21h6"/></svg>
    <span class="badge" id="memCount" hidden>0</span>
  </button>
</header>
<nav class="courses" id="courses" aria-label="Kurs seç"></nav>

<main id="chat"><div id="inner"></div></main>

<footer>
  <div class="composer">
    <textarea id="msg" rows="1" placeholder="Sorunu yaz ya da kodunu yapıştır…" enterkeyhint="send"></textarea>
    <button id="send" aria-label="Gönder" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</footer>

<div id="shade"></div>
<section id="sheet" aria-label="İlerlemen">
  <div class="grab"></div>
  <div class="shead"><h2>İlerlemen</h2><button class="ibtn" id="closeBtn" aria-label="Kapat">✕</button></div>
  <div class="sbody">
    <h3>Adın</h3>
    <div class="field"><input id="nameIn" maxlength="40" placeholder="AXIS sana nasıl hitap etsin?" autocomplete="given-name"></div>
    <h3>Claude API anahtarı</h3>
    <div class="field"><input id="keyIn" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false"><button class="ibtn" id="keySave" aria-label="Kaydet">✓</button></div>
    <div class="empty" id="keyInfo" style="margin-top:6px;font-size:12.5px"></div>
    <h3>AXIS'in notları</h3><div id="facts"></div>
    <h3>Çalışılacaklar</h3><div id="notes"></div>
    <button class="wide" id="resetBtn">Sohbeti temizle</button>
  </div>
  <div class="sfoot"><img src="/logo_alreonx.png" alt="AlreonX"><small>Anahtarın, notların ve sohbetin sadece bu telefonda saklanır.</small></div>
</section>

<script src="/axis-core.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- Küçük markdown ----------
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(src) {
  const blocks = [], out = []; let list = null;
  src = esc(src).replace(/```[\w+-]*\n?([\s\S]*?)```/g, (_, c) => { blocks.push(c.replace(/\n$/, "")); return `\u0000${blocks.length - 1}\u0000`; });
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of src.split("\n")) {
    let m;
    if ((m = line.match(/^\u0000(\d+)\u0000$/))) { close(); out.push(`<pre><button class="codecopy">Kopyala</button><code>${blocks[m[1]]}</code></pre>`); }
    else if ((m = line.match(/^(#{1,3})\s+(.*)/))) { close(); out.push(`<h3>${inline(m[2])}</h3>`); }
    else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if (!line.trim()) close();
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close();
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre><code>${blocks[i]}</code></pre>`);
}

// ---------- Öneriler ----------
const SUGGEST = {
  "Python": [["fill", "Bu hata ne demek?", "Hata mesajını yapıştır", "Bu hatayı alıyorum:\n"], ["fill", "Kodumu kontrol et", "Önce ipucu, sonra çözüm", "Kodum çalışmıyor, kontrol eder misin?\n```python\n\n```"], ["q", "for döngüsünü anlat", "Basit örneklerle"], ["q", "Listeler nasıl çalışır?", "append, index, dilimleme"]],
  "C": [["q", "Pointer nedir?", "Adım adım anlatım"], ["q", "Segmentation fault neden olur?", "En sık sebepler"], ["fill", "Kodumu kontrol et", "Önce ipucu, sonra çözüm", "Kodum çalışmıyor, kontrol eder misin?\n```c\n\n```"], ["q", "scanf ile girdi alma", "Sık yapılan hatalar"]],
  "C++": [["q", "Class ve object farkı", "Gerçek hayattan örnekle"], ["q", "vector nasıl kullanılır?", "push_back, size, döngü"], ["fill", "Kodumu kontrol et", "Önce ipucu, sonra çözüm", "Kodum çalışmıyor, kontrol eder misin?\n```cpp\n\n```"], ["q", "Referans ve pointer farkı", "Ne zaman hangisi?"]],
  "Arduino/ESP32": [["q", "LED yakıp söndürme devresi", "Bağlantı + kod"], ["q", "ESP32 WiFi'ye bağlanmıyor", "Adım adım kontrol"], ["q", "Sensörden değer okuma", "analogRead ve Serial"], ["fill", "Kodumu kontrol et", "Önce ipucu, sonra çözüm", "Kodum çalışmıyor, kontrol eder misin?\n```cpp\n\n```"]],
};
const QUICK = ["💡 Bir ipucu daha", "✅ Çözümü göster", "🐢 Daha basit anlat", "🏋️ Bana bir alıştırma ver"];

// ---------- Çizim ----------
const inner = $("inner"), chat = $("chat"), box = $("msg"), sendBtn = $("send");
let pending = null, deferredInstall = null, serverMode = false;

function visible() {
  const log = AXIS.state.log; let start = 0;
  log.forEach((e, i) => { if (e.kind === "reset") start = i + 1; });
  return log.slice(start).filter(e => e.kind !== "reset");
}

function render() {
  const st = AXIS.state, items = visible(), course = st.course;
  let h = "";
  if (!items.length) {
    const name = st.name ? " " + esc(st.name) : "";
    h = `<div id="welcome"><img class="wlogo" src="/logo_axis.png" alt="AXIS — AlreonX Intelligent System">
      <h1>Merhaba${name} 👋</h1><p>Ben AXIS, AlreonX öğretmen yardımcın. <b>${esc(course)}</b> dersinde nerede takıldın?</p>
      <div class="chips">${SUGGEST[course].map(([k, a, b, f]) => `<button class="chip" ${k === "fill" ? `data-fill="${esc(f)}"` : `data-q="${esc(a)}"`}><b>${esc(a)}</b><small>${esc(b)}</small></button>`).join("")}</div>
      ${!st.apiKey && !serverMode ? `<div class="keycard">Başlamak için Claude API anahtarını gir. Anahtar sadece bu telefonda saklanır.<br><button data-openkey="1">Anahtarı gir</button></div>` : ""}
      <div class="install${deferredInstall ? " show" : ""}" id="install"><span>AXIS'i ana ekrana ekle, uygulama gibi aç.</span><button data-install="1">Yükle</button></div></div>`;
  }
  for (const e of items) {
    if (e.kind === "user") h += `<div class="msg user"><div class="bubble">${md(e.text)}</div></div>`;
    else if (e.kind === "axis") h += `<div class="msg axis"><div class="avatar"></div><div class="bubble">${md(e.text)}</div></div>`;
    else if (e.kind === "tool") h += `<div class="tool"><span>${esc(e.text)}</span></div>`;
    else if (e.kind === "err") h += `<div class="err">⚠️ ${esc(e.text)}</div>`;
  }
  const last = items[items.length - 1];
  if (AXIS.busy) h += `<div class="msg axis typing"><div class="avatar"></div><div class="bubble"><div class="dots"><i></i><i></i><i></i></div>Düşünüyor…</div></div>`;
  else if (last && last.kind === "axis") h += `<div class="quick">${QUICK.map(q => `<button class="qbtn" data-q="${q.slice(2).trim()}">${q}</button>`).join("")}</div>`;
  inner.innerHTML = h;
  chat.scrollTop = chat.scrollHeight;

  $("courses").innerHTML = AXIS.COURSES.map(c => `<button class="course${c === course ? " on" : ""}" data-course="${esc(c)}">${esc(c)}</button>`).join("");
  const n = st.facts.length + st.notes.length;
  $("memCount").hidden = !n; $("memCount").textContent = n;
  $("facts").innerHTML = st.facts.length ? st.facts.map(f => `<div class="item"><span>${esc(f)}</span><button aria-label="Unut" data-forget="${esc(f)}">×</button></div>`).join("")
    : '<div class="empty">Henüz bir şey bilmiyor. Ona hangi konuda zorlandığını anlat, buraya kaydetsin.</div>';
  $("notes").innerHTML = st.notes.length ? st.notes.map(x => `<div class="item"><span>${esc(x.text)}<small>${esc(x.t)}</small></span><button aria-label="Tamamlandı" data-done="${esc(x.text)}">✓</button></div>`).join("")
    : '<div class="empty">"Yarın döngüleri çalışmamı hatırlat" gibi söyleyebilirsin.</div>';
  $("hdr").classList.toggle("thinking", AXIS.busy);
  $("statusText").textContent = AXIS.busy ? "Düşünüyor…" : "Hazır";
  grow();
}

function grow() { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 140) + "px"; sendBtn.disabled = AXIS.busy || !box.value.trim(); }

async function send(text) {
  const m = (text ?? box.value).trim();
  if (!m || AXIS.busy) return;
  box.value = ""; box.blur();
  try { await AXIS.send(m, { onStep: render }); } catch (e) {}
  render();
}

// ---------- Olaylar ----------
box.addEventListener("input", grow);
box.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); send(); } });
sendBtn.addEventListener("click", () => send());
$("newBtn").addEventListener("click", () => { if (!AXIS.busy) { AXIS.reset(); render(); } });
function openSheet(focusKey) {
  $("nameIn").value = AXIS.state.name;
  $("keyIn").value = AXIS.state.apiKey;
  $("keyInfo").textContent = AXIS.state.apiKey ? "Kayıtlı ✓ Sadece bu telefonda saklanıyor." : (serverMode ? "Gerekmiyor: AXIS sunucusu üzerinden bağlısın." : "console.anthropic.com → API Keys'ten alabilirsin.");
  document.body.classList.add("open");
  if (focusKey) setTimeout(() => $("keyIn").focus(), 250);
}
$("progBtn").addEventListener("click", () => openSheet(false));
$("keySave").addEventListener("click", () => { AXIS.state.apiKey = $("keyIn").value; openSheet(false); render(); });
$("keyIn").addEventListener("change", e => { AXIS.state.apiKey = e.target.value; render(); });
const closeSheet = () => document.body.classList.remove("open");
$("closeBtn").addEventListener("click", closeSheet); $("shade").addEventListener("click", closeSheet);
$("nameIn").addEventListener("change", e => { AXIS.state.name = e.target.value; render(); });
$("resetBtn").addEventListener("click", () => { if (!AXIS.busy) { AXIS.reset(); closeSheet(); render(); } });

document.body.addEventListener("click", async e => {
  const t = e.target.closest("[data-q],[data-fill],[data-course],[data-forget],[data-done],[data-install],[data-openkey],.codecopy");
  if (!t) return;
  if (t.dataset.openkey) openSheet(true);
  else if (t.dataset.q) send(t.dataset.q);
  else if (t.dataset.fill) { box.value = t.dataset.fill; grow(); box.focus(); const i = box.value.indexOf("```"); const p = i >= 0 ? box.value.indexOf("\n", i) + 1 : box.value.length; box.setSelectionRange(p, p); }
  else if (t.dataset.course) { if (!AXIS.busy) { AXIS.state.course = t.dataset.course; render(); } }
  else if (t.dataset.forget !== undefined) { AXIS.forgetExact(t.dataset.forget); render(); }
  else if (t.dataset.done !== undefined) { AXIS.noteDone(t.dataset.done); render(); }
  else if (t.dataset.install && deferredInstall) { deferredInstall.prompt(); deferredInstall = null; render(); }
  else if (t.classList.contains("codecopy")) {
    try { await navigator.clipboard.writeText(t.parentElement.querySelector("code").innerText); t.textContent = "Kopyalandı ✓"; } catch (err) { t.textContent = "Kopyalanamadı"; }
    setTimeout(() => t.textContent = "Kopyala", 1500);
  }
});

// Ana ekrana ekleme (Android Chrome)
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; if (!visible().length) render(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

// AXIS sunucusu üzerinden mi açıldık? (öyleyse anahtar gerekmez)
fetch("/health", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(j => { serverMode = !!(j && j.ok && j.name === "AXIS sunucusu"); render(); }).catch(() => {});
render();
</script>
